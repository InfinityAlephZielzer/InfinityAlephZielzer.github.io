<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfinityAlephZielzer | Portfolio</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --terminal-bg: #090c10;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #007ACC;
      --accent-light: #38bdf8;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    .hero {
      text-align: center;
      padding-bottom: 2.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.25rem;
    }

    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      object-fit: cover;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 24px rgba(0, 122, 204, 0.35);
      transition: transform 0.25s ease;
    }

    .avatar:hover {
      transform: scale(1.04);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .name-link {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .name-link:hover {
      color: var(--accent-light);
      text-decoration: underline;
    }

    .subtitle {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    .tagline-quote {
      font-style: italic;
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .github-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.65rem 1.35rem;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .github-btn:hover {
      background-color: #008be8;
      transform: translateY(-2px);
    }

    .section-heading {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .terminal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .terminal-header {
      background-color: var(--terminal-bg);
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }

    .terminal-title {
      margin-left: 0.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .terminal-body {
      padding: 1.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .row {
      display: grid;
      grid-template-columns: 185px 1fr;
      gap: 0.5rem;
    }

    .label {
      color: var(--accent-light);
      font-weight: 600;
    }

    .value {
      color: var(--text);
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.25rem;
    }

    .skill-tag {
      background: rgba(0, 122, 204, 0.15);
      border: 1px solid rgba(0, 122, 204, 0.4);
      color: #7dd3fc;
      padding: 0.15rem 0.6rem;
      border-radius: 6px;
      font-size: 0.82rem;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent-light);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.55rem;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0.2rem;
      }
    }
  </style>
</head>
